<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dark Cache</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="play.css">

</head>

<body>

<div id="passwordScreen">

    <div class="passwordBox">

        <p>Introduce la contraseña</p>

        <input
            type="password"
            id="passwordInput"
            autocomplete="off"
            spellcheck="false"
        >

        <button id="passwordButton">
            ENTRAR
        </button>

        <div id="passwordError"></div>

    </div>

</div>

<div id="startScreen">

    <button id="startButton">
        COMENZAR
    </button>

</div>

<div id="intro"></div>

<div id="scene">

    <img
        id="sceneImage"
        src=""
        alt="Escena"
        draggable="false">

    <div id="hotspotLayer"></div>

</div>

<!-- Motores -->

<script src="dc-engine/intro.js" defer></script>
<script src="dc-engine/hotspot.js" defer></script>
<script src="dc-engine/audio-manager.js" defer></script>
<script src="dc-engine/scene-manager.js" defer></script>

<!-- Capítulo 1 -->

<script src="chapters/chapter01/scene01.js" defer></script>
<script src="chapters/chapter01/index.js" defer></script>

<!-- Juego -->

<script src="play.js" defer></script>

</body>

</html>
