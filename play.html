<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dark Cache</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="play.css">

</head>

<body>

<div id="passwordScreen">

    <div class="passwordBox">

        <p>Introduce la contraseña</p>

        <input
            type="password"
            id="passwordInput"
            autocomplete="off"
            spellcheck="false"
        >

        <button id="passwordButton">
            ENTRAR
        </button>

        <div id="passwordError"></div>

    </div>

</div>

<div id="startScreen">

    <button id="startButton">
        COMENZAR
    </button>

</div>

<div id="intro"></div>

<div id="scene">

    <img
        id="sceneImage"
        src=""
        alt="Escena"
        draggable="false">

    <div id="hotspotLayer"></div>
    
</div>

<!-- ===========================
     CUADRO DE DIÁLOGO
=========================== -->

<div id="dialogBox">

    <div id="dialogSpeaker"></div>

    <div id="dialogText"></div>

</div>

<!-- ===========================
     PANEL DEL EDITOR
=========================== -->

<div id="editorPanel">

    <div class="editorTitle">

        Hotspot creado

    </div>

    <div class="editorRow">

    <label>ID</label>

    <input
        id="editorId"
        type="text"
        autocomplete="off"
        spellcheck="false">

    <button id="saveIdButton">

        💾

    </button>

</div>
    
    <pre id="editorCode"></pre>

    <div class="editorButtons">

        <button id="copyHotspotButton">

            📋 COPIAR

        </button>

        <button id="closeEditorButton">

            ✖ CERRAR

        </button>

    </div>

</div>

<!-- ===========================
     MOTORES
=========================== -->

<script src="dc-engine/intro.js" defer></script>
<script src="dc-engine/hotspot-manager.js" defer></script>
<script src="dc-engine/audio-manager.js" defer></script>
<script src="dc-engine/scene-manager.js" defer></script>
<script src="dc-engine/dialog-manager.js" defer></script>
<script src="dc-engine/hotspot-editor.js" defer></script>

<!-- ===========================
     CAPÍTULO 1
=========================== -->

<script src="chapters/chapter01/dialogs.js" defer></script>
<script src="chapters/chapter01/scene01.js" defer></script>
<script src="chapters/chapter01/scene02.js" defer></script>
<script src="chapters/chapter01/intro.js" defer></script>

<!-- ===========================
     JUEGO
=========================== -->

<script src="play.js" defer></script>

</body>

</html>
